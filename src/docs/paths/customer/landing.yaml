/api/v1/landing/statistics:
  get:
    tags: [Landing]
    summary: Active landing statistics
    description: Ordered by displayOrder. Public.
    security: []
    responses:
      "200":
        description: "data: [{ id, label, description, icon, displayOrder, isActive, createdAt, updatedAt }]"

/api/v1/landing/testimonials:
  get:
    tags: [Landing]
    summary: Approved testimonials
    description: Newest first. Public.
    security: []
    responses:
      "200":
        description: "data: [{ id, name, role, content, rating, avatar, ... }]"

/api/v1/landing/blog:
  get:
    tags: [Landing]
    summary: Published blog posts
    description: Newest first. Public.
    security: []
    responses:
      "200":
        description: "data: [{ id, title, slug, excerpt, content, coverImage, author, publishedAt, ... }]"

/api/v1/landing/blog/{slug}:
  get:
    tags: [Landing]
    summary: One published blog post
    security: []
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string, maxLength: 200 } }
    responses:
      "200": { description: "data: { id, title, slug, excerpt, content, coverImage, author, category, publishedAt, ... }" }
      "404": { description: Unknown or not published }

/api/v1/landing/faq:
  get:
    tags: [Landing]
    summary: Active FAQs
    description: Ordered by displayOrder. Public.
    security: []
    responses:
      "200":
        description: "data: [{ id, question, answer, category, displayOrder, ... }]"

/api/v1/landing/stories:
  get:
    tags: [Landing]
    summary: Published success stories
    description: Newest first. Public.
    security: []
    responses:
      "200":
        description: "data: [{ id, name, role, quote, image, ... }]"

/api/v1/landing/newsletter/subscribe:
  post:
    tags: [Landing]
    summary: Subscribe to the newsletter
    description: Public. At most 5 attempts per hour from one address.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      "201":
        description: Subscribed
      "400":
        description: Not a valid email address
      "409":
        description: ALREADY_SUBSCRIBED
      "429":
        description: RATE_LIMITED

/api/v1/landing/waitlist:
  post:
    tags: [Landing]
    summary: Join the pre-launch waitlist
    description: >-
      Public. Stage 1 (email, role, consent) joins the list; stage 2 adds optional
      details to the same row (pass the signupId stage 1 returned). At most 20
      requests per 15 minutes from one address.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, role, consent]
            properties:
              stage: { type: integer, enum: [1, 2], default: 1 }
              signupId: { type: string, format: uuid }
              email: { type: string, format: email }
              role: { type: string, enum: [Client, Customer, Hairstylist, Stylist] }
              consent: { type: boolean, enum: [true] }
              consentText: { type: string }
              launchDate: { type: string }
              clientTime: { type: string, format: date-time }
              utm_source: { type: string }
              utm_medium: { type: string }
              utm_campaign: { type: string }
              utm_content: { type: string }
              utm_term: { type: string }
              ref: { type: string }
              referrer: { type: string }
              page: { type: string }
              details:
                type: object
                properties:
                  hairType: { type: string }
                  styles: { type: array, items: { type: string } }
                  workSetting: { type: string }
                  social: { type: string }
                  postcode: { type: string }
                  city: { type: string }
    responses:
      "201":
        description: "Joined (stage 1). data: { id, stage }"
      "200":
        description: "Details saved (stage 2). data: { id, stage }"
      "400":
        description: VALIDATION_ERROR
      "409":
        description: EMAIL_EXISTS
      "429":
        description: RATE_LIMITED
