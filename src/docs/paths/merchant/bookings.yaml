/api/v1/merchant/bookings:
  get:
    tags: [Merchant - Bookings]
    summary: The salon's bookings between two dates (at most 62 days; abandoned customer checkouts left out)
    parameters:
      - { in: query, name: from, required: true, schema: { type: string, example: "2026-10-18" } }
      - { in: query, name: to, required: true, schema: { type: string, example: "2026-10-24" } }
    responses:
      "200": { description: "data: [{ id, orderId, date, time, duration, durationMinutes, status, paymentStatus, serviceName, amount, clientName, isCustomerBooking, staff: [{ id, name }] }]" }
  post:
    tags: [Merchant - Bookings]
    summary: Book one of the salon's clients in (Confirmed, paid at the salon). Price and length come from the service.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [clientId, serviceId, date, time]
            properties:
              clientId: { type: string, format: uuid }
              serviceId: { type: string, format: uuid }
              date: { type: string, example: "2026-10-21" }
              time: { type: string, example: "2:00 PM" }
              staffId: { type: string, format: uuid }
              specialRequests: { type: string }
              timezoneOffsetMinutes: { type: integer }
    responses:
      "201": { description: "data: { id, orderId }" }
      "400": { description: Closed, outside opening hours, clashing, blocked or in the past }

/api/v1/merchant/bookings/form-options:
  get:
    tags: [Merchant - Bookings]
    summary: The new-booking form's clients, services and team
    responses:
      "200": { description: "data: { clients: [{ id, name }], services: [{ id, name, duration, durationMinutes, price }], team: [{ id, name, avatar }] }" }

/api/v1/merchant/bookings/available-times:
  get:
    tags: [Merchant - Bookings]
    summary: Free start times on a day — for a service (new booking) or for a booking (reschedule)
    parameters:
      - { in: query, name: date, required: true, schema: { type: string } }
      - { in: query, name: serviceId, schema: { type: string, format: uuid } }
      - { in: query, name: bookingId, schema: { type: string, format: uuid } }
      - { in: query, name: timezoneOffsetMinutes, schema: { type: integer } }
    responses:
      "200": { description: 'data: ["9:00 AM", "9:30 AM", ...]' }

/api/v1/merchant/bookings/{id}:
  get:
    tags: [Merchant - Bookings]
    summary: One booking with its client, services, team, payment and review
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    responses:
      "200": { description: "data: { id, referenceId, status, createdAt, client, appointment, staff, serviceStaffIds, services, payment, notes, review }" }
      "404": { description: Not this salon's booking }

/api/v1/merchant/bookings/{id}/accept:
  post:
    tags: [Merchant - Bookings]
    summary: Accept one of the salon's own Pending bookings (a customer's checkout confirms itself when paid)
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    responses: { "200": { description: "data: { status }" }, "400": { description: NOT_PENDING / CUSTOMER_CHECKOUT } }

/api/v1/merchant/bookings/{id}/cancel:
  post:
    tags: [Merchant - Bookings]
    summary: The salon cancels or rejects the booking (whole order); a held card payment is refunded in full
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
    responses: { "200": { description: "data: { status, refunded? }" } }

/api/v1/merchant/bookings/{id}/complete:
  post:
    tags: [Merchant - Bookings]
    summary: Complete a confirmed booking (from its day on); the held payment is released to the salon's wallet
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    requestBody: { content: { application/json: { schema: { type: object, properties: { notes: { type: string }, timezoneOffsetMinutes: { type: integer } } } } } }
    responses: { "200": { description: "data: { status }" }, "400": { description: NOT_CONFIRMED / TOO_EARLY } }

/api/v1/merchant/bookings/{id}/no-show:
  post:
    tags: [Merchant - Bookings]
    summary: Mark a confirmed booking as a no-show (once it has started); the salon is paid as for a completed booking
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    responses: { "200": { description: "data: { status }" } }

/api/v1/merchant/bookings/{id}/reschedule:
  post:
    tags: [Merchant - Bookings]
    summary: Move the booking (whole order) to a new day and time
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    requestBody:
      content:
        application/json:
          schema: { type: object, required: [date, time], properties: { date: { type: string }, time: { type: string, example: "2:00 PM" }, reason: { type: string }, timezoneOffsetMinutes: { type: integer } } }
    responses: { "200": { description: "data: { date, time }" } }

/api/v1/merchant/bookings/{id}/staff:
  put:
    tags: [Merchant - Bookings]
    summary: Set who does the booking (first is the main stylist)
    parameters: [{ in: path, name: id, required: true, description: "Appointment id or order number (BKID-1234567)", schema: { type: string } }]
    requestBody: { content: { application/json: { schema: { type: object, required: [staffIds], properties: { staffIds: { type: array, items: { type: string, format: uuid } } } } } } }
    responses: { "200": { description: "data: { staffIds }" }, "400": { description: NOT_ON_TEAM / NOT_EDITABLE } }

/api/v1/merchant/blocked-times:
  get:
    tags: [Merchant - Bookings]
    summary: Blocked-out time between two dates
    parameters:
      - { in: query, name: from, required: true, schema: { type: string } }
      - { in: query, name: to, required: true, schema: { type: string } }
    responses: { "200": { description: "data: [{ id, type, title, date, startTime, endTime, teamMember, description }]" } }
  post:
    tags: [Merchant - Bookings]
    summary: Block off time (teamMember is a team member's full name; empty = the whole salon)
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [title, date, startTime, endTime, description]
            properties:
              type: { type: string, enum: [custom, lunch, meeting, training] }
              title: { type: string }
              date: { type: string }
              startTime: { type: string, example: "09:30" }
              endTime: { type: string, example: "10:00" }
              teamMember: { type: string }
              description: { type: string }
    responses: { "201": { description: "data: the blocked time" } }

/api/v1/merchant/blocked-times/{id}:
  put:
    tags: [Merchant - Bookings]
    summary: Change blocked time (same body as creating)
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    responses: { "200": { description: "data: the blocked time" } }
  delete:
    tags: [Merchant - Bookings]
    summary: Remove blocked time
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    responses: { "200": { description: Deleted } }
