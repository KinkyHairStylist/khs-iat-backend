/api/v1/merchant/gift-cards:
  get:
    tags: [Merchant - Gift cards]
    summary: The salon's gift cards (never their codes), newest first
    parameters:
      - { in: query, name: search, schema: { type: string }, description: "Title, description, recipient name or email" }
      - { in: query, name: status, schema: { type: string, enum: [All, Active, Inactive, Used, Expired] } }
      - { in: query, name: page, schema: { type: integer } }
      - { in: query, name: limit, schema: { type: integer, maximum: 60 } }
    responses:
      "200": { description: "data: { giftCards: [{ id, title, description, message, template, amount, remainingAmount, currency, benefits, expiryInDays, expiresAt, status, expired, sold, recipientName, recipientEmail, deactivatedBy, deactivatedByRole, deactivatedAt, createdAt, businessName, editable }], total, page, totalPages, startIndex, endIndex }" }
  post:
    tags: [Merchant - Gift cards]
    summary: Create a gift card listing. The code is generated by the server and never returned.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [template, title, amount, benefits, expiryInDays]
            properties:
              template: { type: string, enum: [valentine, birthday, anniversary, general, mothers, fathers, christmas, wedding, graduation, custom] }
              title: { type: string }
              description: { type: string }
              message: { type: string }
              amount: { type: number, minimum: 1 }
              benefits: { type: array, items: { type: string, description: "no commas" }, minItems: 1 }
              expiryInDays: { type: integer, minimum: 1, maximum: 365 }
    responses: { "201": { description: "data: the gift card" } }

/api/v1/merchant/gift-cards/summary:
  get:
    tags: [Merchant - Gift cards]
    summary: Totals for the gift card dashboard
    responses: { "200": { description: "data: { currency, totalCards, totalValue, totalSoldCards, totalSoldValue, totalRedeemedCards, totalRedeemedValue, totalRemainingValue, totalAvailableCards, totalExpiredCards }" } }

/api/v1/merchant/gift-cards/{id}:
  parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
  get:
    tags: [Merchant - Gift cards]
    summary: One of the salon's gift cards
    responses: { "200": { description: "data: the gift card" }, "404": { description: NOT_FOUND } }
  put:
    tags: [Merchant - Gift cards]
    summary: Change an unsold, active card within 24 hours of creating it (same body as create)
    responses: { "200": { description: "data: the gift card" }, "409": { description: GIFT_CARD_SOLD / GIFT_CARD_INACTIVE / EDIT_WINDOW_PASSED / GIFT_CARD_BUSY } }
  delete:
    tags: [Merchant - Gift cards]
    summary: Delete an unsold card
    responses: { "200": { description: OK }, "409": { description: GIFT_CARD_SOLD / GIFT_CARD_BUSY } }

/api/v1/merchant/gift-cards/{id}/deactivate:
  put:
    tags: [Merchant - Gift cards]
    summary: Take a card off sale. A bought card with money left on it can only be stopped by KHS.
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    responses: { "200": { description: "data: the gift card" }, "403": { description: GIFT_CARD_HELD } }

/api/v1/merchant/gift-cards/{id}/reactivate:
  put:
    tags: [Merchant - Gift cards]
    summary: Bring back a card the salon deactivated itself
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    responses: { "200": { description: "data: the gift card" }, "403": { description: DEACTIVATED_BY_KHS } }
